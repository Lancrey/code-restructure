name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (used by the baseline end-to-end tests)
        run: python -m pip install -q pytest
      - name: Lint scripts (ruff, errors and pyflakes rules)
        run: python -m pip install -q ruff && ruff check --select E9,F code-restructure/scripts tests
      - name: Compile scripts
        run: python -m py_compile code-restructure/scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
